<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProofQuery — CFPB complaints</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --good: #059669; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 32px 24px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  h1 .dot { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 13px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; color: var(--ink); }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
    margin-bottom: 28px; }
  .card { background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px; }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 6px; }
  .kpi .value { font-size: 26px; font-weight: 650; font-variant-numeric:
    tabular-nums; letter-spacing: -0.02em; }
  .kpi .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .panel { background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  .note { color: var(--muted); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px;
    font-variant-numeric: tabular-nums; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 12px;
    border-bottom: 1px solid var(--line); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  td.pos { color: var(--good); } td.neg { color: var(--bad); }
  footer { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line);
    padding-top: 16px; margin-top: 8px; }
  footer code { background: #eef0f3; padding: 1px 5px; border-radius: 4px;
    font-size: 12px; }
  .empty { padding: 24px 0; color: var(--muted); font-size: 13.5px; }
  svg text { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    fill: var(--muted); }
  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ProofQuery<span class="dot">.</span> CFPB complaints</h1>
    <div class="meta" id="status">loading…</div>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="panel">
    <h2>Monthly complaint volume</h2>
    <div id="chart"></div>
  </section>

  <section class="panel">
    <h2>Anomalies (ewma)</h2>
    <div id="anoms"><div class="empty">loading…</div></div>
  </section>

  <footer id="prov">loading provenance…</footer>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const get = async (url) => {
    try { const r = await fetch(url); return r.ok ? await r.json() : null; }
    catch (e) { return null; }
  };

  // --- tolerant readers: metric shapes are owned by the metrics lane ------
  const NUMKEYS = ["value", "rate", "current", "total", "count", "avg",
                   "timely_rate", "monetary_rate"];
  function findNumber(o, depth) {
    if (depth > 4 || o == null) return null;
    if (typeof o === "number") return o;
    if (typeof o !== "object") return null;
    for (const k of NUMKEYS) if (typeof o[k] === "number") return o[k];
    for (const k in o) if (k !== "name") {
      const v = findNumber(o[k], depth + 1);
      if (v !== null) return v;
    }
    return null;
  }
  function findSeries(o, depth) {
    if (depth > 4 || o == null) return null;
    if (Array.isArray(o)) return seriesFromArr(o);
    if (typeof o !== "object") return null;
    for (const k of ["series", "monthly", "by_month", "data", "values", "points"])
      if (o[k]) { const s = findSeries(o[k], depth + 1); if (s) return s; }
    for (const k in o) if (!NUMKEYS.includes(k)) {
      const s = findSeries(o[k], depth + 1); if (s) return s;
    }
    return null;
  }
  function seriesFromArr(a) {
    if (!Array.isArray(a) || a.length < 2) return null;
    const out = [];
    for (const it of a) {
      if (Array.isArray(it) && it.length >= 2) out.push({ x: it[0], y: +it[1] });
      else if (it && typeof it === "object") {
        let y = null;
        for (const k of ["value", "complaints", "count", "y"])
          if (typeof it[k] === "number") { y = it[k]; break; }
        if (y === null) continue;
        let x = null;
        for (const k of ["month", "day", "period", "date", "date_received", "x"])
          if (it[k] != null) { x = it[k]; break; }
        out.push({ x: x, y: y });
      }
    }
    return out.length >= 2 ? out : null;
  }
  const fmtInt = (n) => n == null ? "—" : Math.round(n).toLocaleString("en-US");
  const fmtPct = (n) => n == null ? "—" : (n * 100).toFixed(1) + "%";
  const xlab = (x) => typeof x === "string" ? x.slice(0, 7)
                   : (x && x.toISOString ? x.toISOString().slice(0, 7) : String(x));

  // --- fetch -------------------------------------------------------------
  const health = await get("/healthz");
  const mTimely = await get("/metrics/timely_rate");
  const mMonetary = await get("/metrics/monetary_relief_rate");
  const mVolume = await get("/metrics/monthly_volume_trend");
  const anomRes = await get("/anomalies?method=ewma");

  if (!health) { $("status").textContent = "service unreachable"; return; }
  $("status").textContent = "v" + (health.version || "?") + " · " +
    fmtInt(health.row_count) + " rows loaded";

  // --- KPI cards ----------------------------------------------------------
  const volSeries = mVolume ? findSeries(mVolume, 0) : null;
  const total = volSeries ? volSeries.reduce((s, p) => s + p.y, 0)
                          : findNumber(mVolume, 0);
  const months = volSeries ? volSeries.length : null;
  const kpis = [
    ["Complaints", fmtInt(total != null ? total : health.row_count), "in warehouse"],
    ["Timely rate", fmtPct(findNumber(mTimely, 0)), "companies answered on time"],
    ["Monetary relief", fmtPct(findNumber(mMonetary, 0)), "share closed with $"],
    ["Months covered", fmtInt(months), "on record"],
    ["Avg / month", fmtInt(months && total ? total / months : null), "complaints"],
  ];
  $("kpis").innerHTML = kpis.map(k =>
    `<div class="card kpi"><div class="label">${k[0]}</div>` +
    `<div class="value">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join("");

  // --- SVG line chart -----------------------------------------------------
  (function drawChart() {
    const box = $("chart");
    if (!volSeries) {
      box.innerHTML = '<div class="empty">volume metric unavailable ' +
        "(metrics lane pending or unexpected shape).</div>"; return;
    }
    const W = 1356, H = 280, padL = 56, padR = 12, padT = 14, padB = 30;
    const xs = volSeries.map(p => xlab(p.x));
    const ys = volSeries.map(p => p.y);
    const ymax = Math.max(...ys) * 1.08 || 1, ymin = 0;
    const X = i => padL + i * (W - padL - padR) / Math.max(volSeries.length - 1, 1);
    const Y = v => padT + (1 - (v - ymin) / (ymax - ymin)) * (H - padT - padB);
    let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" ` +
            `aria-label="Monthly complaint volume">`;
    for (let g = 0; g <= 4; g++) {           // gridlines + y labels
      const v = ymin + (ymax - ymin) * g / 4, y = Y(v);
      s += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#e5e7eb"/>` +
           `<text x="${padL - 8}" y="${y + 4}" text-anchor="end">${fmtInt(v)}</text>`;
    }
    const pts = ys.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    const area = `${padL},${Y(0)} ${pts} ${X(ys.length - 1)},${Y(0)}`;
    s += `<polygon points="${area}" fill="rgba(37,99,235,0.08)"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="#2563eb" stroke-width="2" ` +
         `stroke-linejoin="round"/>`;
    pts.split(" ").forEach(p => { const [x, y] = p.split(",");
      s += `<circle cx="${x}" cy="${y}" r="2.5" fill="#2563eb"/>`; });
    const step = Math.max(1, Math.ceil(xs.length / 12));
    xs.forEach((t, i) => { if (i % step === 0 || i === xs.length - 1)
      s += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle">${t}</text>`; });
    $("chart").innerHTML = s + "</svg>";
  })();

  // --- anomalies table ----------------------------------------------------
  (function drawAnoms() {
    const box = $("anoms");
    let rows = anomRes && (Array.isArray(anomRes) ? anomRes :
               Array.isArray(anomRes.anomalies) ? anomRes.anomalies :
               findSeries(anomRes, 0));
    if (anomRes && !Array.isArray(rows) && rows === null &&
        !Array.isArray(anomRes.anomalies))
      rows = anomRes.anomalies ? [anomRes.anomalies] : null;
    if (anomRes && !rows && Array.isArray(anomRes.anomalies)) rows = anomRes.anomalies;
    if (!rows || !rows.length) {
      box.innerHTML = '<div class="empty">' + (anomRes
        ? "No anomalies flagged." : "Anomaly lane pending or no anomalies.") +
        "</div>"; return;
    }
    const cols = [];
    rows.forEach(r => r && typeof r === "object" &&
      Object.keys(r).forEach(k => { if (!cols.includes(k)) cols.push(k); }));
    if (!cols.length) { box.innerHTML = "<pre>" + JSON.stringify(rows) + "</pre>"; return; }
    let h = "<table><thead><tr>" +
      cols.map(c => `<th>${c.replace(/_/g, " ")}</th>`).join("") + "</tr></thead><tbody>";
    rows.forEach(r => {
      h += "<tr>" + cols.map(c => {
        const v = r ? r[c] : null;
        const cls = typeof v === "number" ? (v > 0 ? ' class="pos"' :
                    v < 0 ? ' class="neg"' : "") : "";
        const t = typeof v === "number" ? (Number.isInteger(v) ? fmtInt(v) : v.toFixed(2))
                : v == null ? "—" : String(v).replace(/T.*/, "");
        return `<td${cls}>${t}</td>`;
      }).join("") + "</tr>";
    });
    box.innerHTML = h + "</tbody></table>";
  })();

  // --- provenance footer ---------------------------------------------------
  $("prov").innerHTML = `Source: CFPB Consumer Complaint Database (CC0) · ` +
    `SHA-256 <code>${health.source_sha256 || "?"}…</code> · ` +
    `${fmtInt(health.row_count)} staging rows · ` +
    `fetched <code>${(health.fetched_at || "?").replace("T", " ").slice(0, 16)}</code> · ` +
    `every figure recomputes from facts.complaints + marts in one DuckDB file.`;
})();
</script>
</body>
</html>
