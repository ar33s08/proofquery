[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofquery"
version = "0.1.0"
description = "Evidence-locked analytics workbench: real federal complaint data, governed SQL marts, statistics, ML baselines, and an NL->SQL analyst agent that only answers from certified numbers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Arees Manesia" }]
dependencies = ["duckdb>=1.0"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
proofquery = "proofquery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofquery = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
